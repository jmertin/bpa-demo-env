[www]
; Worker processes run as www-data (non-root).
user  = www-data
group = www-data

; TCP socket on a non-privileged port so nginx (in the same pod network
; namespace) can reach it via 127.0.0.1:9000.
listen = 0.0.0.0:9000

; Dynamic process manager – suitable for a demo workload.
pm                   = dynamic
pm.max_children      = 10
pm.start_servers     = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
pm.max_requests      = 500

; Forward access and error output to the container log collector.
access.log           = /proc/self/fd/2
catch_workers_output = yes
decorate_workers_output = no

; PHP-FPM clears the environment before spawning workers (clear_env = yes is
; the compiled-in default).  Explicitly forward only the variables the
; application needs so getenv() works inside PHP scripts.
env[MARIADB_HOST]     = $MARIADB_HOST
env[MARIADB_PORT]     = $MARIADB_PORT
env[MARIADB_DATABASE] = $MARIADB_DATABASE
env[MARIADB_USER]     = $MARIADB_USER
env[MARIADB_PASSWORD] = $MARIADB_PASSWORD
