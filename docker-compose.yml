---
# BPA-Demo – Docker Compose deployment (no TLS, local images)
# Use build-scripts/compose.sh – it sources .config, packages the app, and
# builds images locally when they are not already present in the Docker store.
# All custom images use pull_policy: never so Docker never contacts the
# registry; images must be built locally first (compose.sh handles this).
#
# DX O2 agent note:
#   The dxo2 service populates the apmia_data named volume from the image on
#   first start (Docker volume-init behaviour, equivalent to the dxo2-init
#   initContainer in Kubernetes).  The apachephp service mounts the same
#   volume read-only so its entrypoint can inject both the PHP probe and the
#   BPA WebServer Plugin for Apache at startup.
#   Unlike Kubernetes (shared pod network / 127.0.0.1), Compose services reach
#   each other by service name – hence APMIA_PHP_COLLECTOR_HOST=dxo2 and
#   APMIA_BTL_HOST=dxo2 rather than 127.0.0.1.
#
# Static IPs (bpa-demo network, below):
#   Without a user-defined network, Compose puts every service on the
#   project's auto-created default bridge, which Docker assigns IPs to from
#   whichever subnet it picks at network-creation time -- this can shift
#   across a `compose.sh down` + `up` cycle (new network = new IPAM subnet
#   choice) and DX O2 was observed treating this as a distinct host each
#   time, causing stale/duplicate topology entities. Pinning both the
#   subnet and each service's ipv4_address makes every service's address
#   deterministic across down/up cycles, independent of Docker's IPAM.
services:

  dxo2:
    image: ${REGISTRY}/${IMAGE_PREFIX}/dx-o2-agents:${IMAGE_TAG}
    build:
      context: ./src/dx-o2-agents
    pull_policy: never             # use local image only – compose.sh builds it
    environment:
      # APMIA_DEPLOY=false → passive volume (seed only, IA not started).
      # Set to true (default) to run the Infrastructure Agent from this container.
      APMIA_DEPLOY: ${APMIA_DEPLOY:-true}
      # Agent identity – native APMIA Docker container mechanism.
      # The APMIA agent startup script reads APMENV_* vars directly and overrides
      # the corresponding introscope.* profile properties without any file patching.
      # compose.sh always exports these first from DEPLOYMENT_NAME + DEPLOYMENT_POSTFIX
      # ("bpa-demo" + "docker" by default, see .config.example) -- the literal
      # fallbacks below only apply if docker compose is invoked directly, bypassing
      # compose.sh's own defaulting.
      APMENV_INTROSCOPE_AGENT_AGENTNAME:         ${APMIA_AGENT_NAME:-bpa-demo-docker}
      APMENV_INTROSCOPE_AGENT_APPLICATION_NAME:  ${APMIA_APP_NAME:-bpa-demo-docker}
      APMENV_INTROSCOPE_AGENT_HOSTNAME:          ${APMIA_HOST_NAME:-bpa-demo-docker}
      APMENV_INTROSCOPE_AGENT_CUSTOMPROCESSNAME: ${APMIA_PROCESS_NAME:-bpa-demo-docker}
      # Remote-agent (PHP probe) naming: the IA's auto-naming assigns the probe's
      # {collector}/AgentName segment based on which of its own identities has
      # resolved by the time the probe first registers -- if that races ahead of
      # the IA's own EM-dependent name resolution, it falls back to "UnknownAgent"
      # (see CLAUDE.md's "PHP probe injection" section). Disabling auto-naming and
      # forcing the probe agent name directly removes the race instead of trying to
      # win it. Deliberately NOT setting *_PROBE_PROCESS_NAME -- that would rename
      # the literal "php-probes" segment every dxo2-scripts/ template and script
      # matches on, for no benefit (the bug is only in the AgentName segment).
      APMENV_INTROSCOPE_AGENT_AGENTAUTONAMINGENABLED: "false"
      APMENV_INTROSCOPE_REMOTEAGENT_PROBE_AGENT_NAME: ${APMIA_AGENT_NAME:-bpa-demo-docker}
      # Log level: log4j logger spec – level and appender name.
      APMENV_LOG4J_LOGGER_INTROSCOPEAGENT: "${APMIA_LOG_LEVEL:-INFO}, logfile"
      # URL group clamp: limits distinct frontend URL groups tracked by the agent.
      # 50 prevents metric explosion from query-string variations across demo pages.
      APMENV_INTROSCOPE_AGENT_URLGROUP_FRONTEND_URL_CLAMP: "50"
      # ── MariaDB monitoring (APMIA DB Monitor extension) ───────────────────────
      # MYSQL_MONITOR=true activates DB monitoring.  Credentials come from the
      # MARIADB_* vars in .config (git-ignored, never committed).
      # Hostname is the Docker Compose service name (not 127.0.0.1 as in Kubernetes).
      MYSQL_MONITOR: ${MYSQL_MONITOR:-true}
      # Root credentials: the entrypoint uses these to verify the DB Monitor
      # login exists in MariaDB and to create it (with monitoring grants) if
      # it does not, before the IA starts.
      MARIADB_ROOT_USER: root
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      APMENV_INTROSCOPE_AGENT_DBMONITOR_MYSQL_PROFILES:                    bpadb
      APMENV_INTROSCOPE_AGENT_DBMONITOR_MYSQL_QUERY_SNAPSHOTS:             "false"
      APMENV_INTROSCOPE_AGENT_DBMONITOR_MYSQL_QUERYINTERVAL:               "15"
      APMENV_INTROSCOPE_AGENT_DBMONITOR_MYSQL_TRACEINTERVAL:               "30"
      APMENV_INTROSCOPE_AGENT_DBMONITOR_MYSQL_PROFILES_BPADB_INSTANCENAME: ${MARIADB_DATABASE:-phpapp}
      APMENV_INTROSCOPE_AGENT_DBMONITOR_MYSQL_PROFILES_BPADB_HOSTNAME:     mariadb
      APMENV_INTROSCOPE_AGENT_DBMONITOR_MYSQL_PROFILES_BPADB_PORT:         "3306"
      APMENV_INTROSCOPE_AGENT_DBMONITOR_MYSQL_PROFILES_BPADB_USERNAME:     ${MARIADB_USER}
      APMENV_INTROSCOPE_AGENT_DBMONITOR_MYSQL_PROFILES_BPADB_PASSWORD:     ${MARIADB_PASSWORD}
      # 5_6x selects the extension's information_schema-based query set
      # (global_variables/global_status) instead of the default performance_schema
      # ones, which MariaDB does not implement -- see CLAUDE.md for details.
      APMENV_INTROSCOPE_AGENT_DBMONITOR_MYSQL_PROFILES_BPADB_VERSION:      "5_6x"
    # "APMIA fine tuning" section of .config: compose.sh's load_config()
    # collects every APMENV_* variable it finds there into this generated,
    # gitignored file (see .config.example's "APMIA fine tuning" section).
    # Compose loads env_file: values BEFORE the environment: block above, so
    # a name that collides with one of the fixed APMENV_* entries above is
    # overridden BY them, not the other way around -- use the dedicated
    # .config variable instead if you need to override something already
    # managed here.
    env_file:
      - .dxo2-fine-tuning.env
    volumes:
      # Mount read-write so Docker copies /opt/apmia from the image into the
      # named volume on first start (probe .so, BPA .so, pre-configured profile).
      - apmia_data:/opt/apmia
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      bpa-demo:
        ipv4_address: 172.28.0.10

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE:      ${MARIADB_DATABASE}
      MARIADB_USER:          ${MARIADB_USER}
      MARIADB_PASSWORD:      ${MARIADB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      # Schema and seed are applied once on first container creation.
      # Delete the named volume (docker compose down -v) to re-initialise.
      - ./helm/php-demo/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./helm/php-demo/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1",
             "-u", "root", "--password=${MARIADB_ROOT_PASSWORD}"]
      interval: 10s
      timeout:  5s
      retries:  6
      start_period: 30s
    restart: unless-stopped
    networks:
      bpa-demo:
        ipv4_address: 172.28.0.11

  apachephp:
    image: ${REGISTRY}/${IMAGE_PREFIX}/apache-php:${IMAGE_TAG}
    build:
      context: ./src/apache-php   # app.tar.gz must exist here before building
    pull_policy: never             # use local image only – compose.sh builds it
    # Set a human-readable hostname so the PHP probe and BPA Apache module
    # report under this name in the DX O2 metric path instead of the
    # auto-generated Docker container ID.
    hostname: ${APMIA_HOST_NAME:-bpa-demo-docker}
    ports:
      - "8080:8080"
    environment:
      # Hardcoded Compose-network service names – not from .config.
      - MARIADB_HOST=mariadb
      - MARIADB_PORT=3306
      # PHP probe → IA collector and BPA plugin → BTL use the dxo2 service
      # name in Compose (not 127.0.0.1 as in a Kubernetes pod).
      - APMIA_PHP_COLLECTOR_HOST=dxo2
      - APMIA_BTL_HOST=dxo2
      # All remaining vars are passed through from compose.sh which exports
      # each one with a safe default after sourcing .config.
      - MARIADB_DATABASE
      - MARIADB_USER
      - MARIADB_PASSWORD
      - APP_TYPE
      - APMIA_PHP_COLLECTOR_PORT
      - APMIA_BTL_PORT
      - APMIA_APP_NAME
      - APMIA_PHP_AGENT_NAME
      - APMIA_WEB_AGENT_NAME
      # Passthrough only – the snippet contains double-quotes that are unsafe
      # to interpolate directly into YAML.  compose.sh exports the variable
      # with an empty-string default so the container always receives it.
      - APMIA_BROWSER_SNIPPET
    volumes:
      # Populated by the dxo2 service on first start (probe .so + .ini + BPA .so).
      - apmia_data:/opt/apmia:ro
    depends_on:
      mariadb:
        condition: service_healthy
      dxo2:
        condition: service_started
    restart: unless-stopped
    networks:
      bpa-demo:
        ipv4_address: 172.28.0.12

  traffic:
    image: ${REGISTRY}/${IMAGE_PREFIX}/traffic-generator:${IMAGE_TAG}
    build:
      context: ./traffic-generator
    pull_policy: never             # use local image only – compose.sh builds it
    environment:
      TRAFFIC_ENABLED: ${TRAFFIC_ENABLED:-true}
      # Compose service name – not from .config; Kubernetes would use
      # 127.0.0.1 (same pod) or a Service DNS name instead.
      TARGET_URL: http://apachephp:8080
      # Must match the apachephp service's own APP_TYPE (see that service's
      # environment block) so the generator's requests use the same routing
      # mode the app is actually running -- see lib/routing.php.
      APP_TYPE: ${APP_TYPE:-mp}
      MIN_ACTION_DELAY_SECS: ${TRAFFIC_MIN_ACTION_DELAY_SECS:-1}
      MAX_ACTION_DELAY_SECS: ${TRAFFIC_MAX_ACTION_DELAY_SECS:-4}
      MIN_SESSION_DELAY_SECS: ${TRAFFIC_MIN_SESSION_DELAY_SECS:-2}
      MAX_SESSION_DELAY_SECS: ${TRAFFIC_MAX_SESSION_DELAY_SECS:-8}
      TRAFFIC_ANONYMOUS_RATIO: ${TRAFFIC_ANONYMOUS_RATIO:-0.8}
      TRAFFIC_CONCURRENT_SESSIONS: ${TRAFFIC_CONCURRENT_SESSIONS:-3}
      TRAFFIC_SLOWDOWN_PROBABILITY: ${TRAFFIC_SLOWDOWN_PROBABILITY:-0.12}
      TRAFFIC_SLOWDOWN_MIN_SECS: ${TRAFFIC_SLOWDOWN_MIN_SECS:-3}
      TRAFFIC_SLOWDOWN_MAX_SECS: ${TRAFFIC_SLOWDOWN_MAX_SECS:-12}
      LOG_LEVEL: ${TRAFFIC_LOG_LEVEL:-INFO}
    depends_on:
      apachephp:
        condition: service_started
    restart: unless-stopped
    networks:
      bpa-demo:
        ipv4_address: 172.28.0.13

networks:
  bpa-demo:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  mariadb_data:
  apmia_data:   # populated from dx-o2-agents image on first start; delete with down -v
