---
# BPA-Demo – Docker Compose deployment (no TLS, local images)
# Use build-scripts/compose.sh – it sources .config, packages the app, and
# builds images locally when they are not already present in the Docker store.
# All custom images use pull_policy: never so Docker never contacts the
# registry; images must be built locally first (compose.sh handles this).
#
# DX O2 agent note:
#   The dxo2 service populates the apmia_data named volume from the image on
#   first start (Docker volume-init behaviour, equivalent to the dxo2-init
#   initContainer in Kubernetes).  The apachephp service mounts the same
#   volume read-only so its entrypoint can inject both the PHP probe and the
#   BPA WebServer Plugin for Apache at startup.
#   Unlike Kubernetes (shared pod network / 127.0.0.1), Compose services reach
#   each other by service name – hence APMIA_PHP_COLLECTOR_HOST=dxo2 and
#   APMIA_BTL_HOST=dxo2 rather than 127.0.0.1.
services:

  dxo2:
    image: ${REGISTRY}/${IMAGE_PREFIX}/dx-o2-agents:${IMAGE_TAG}
    build:
      context: ./src/dx-o2-agents
    pull_policy: never             # use local image only – compose.sh builds it
    environment:
      # Agent identity – native APMIA Docker container mechanism.
      # The APMIA agent startup script reads APMENV_* vars directly and overrides
      # the corresponding introscope.* profile properties without any file patching.
      APMENV_INTROSCOPE_AGENT_AGENTNAME:         ${APMIA_AGENT_NAME:-bpa-demo-agent}
      APMENV_INTROSCOPE_AGENT_APPLICATION_NAME:  ${APMIA_APP_NAME:-bpa-demo}
      APMENV_INTROSCOPE_AGENT_HOSTNAME:          ${APMIA_HOST_NAME:-bpa-demo-host}
      APMENV_INTROSCOPE_AGENT_CUSTOMPROCESSNAME: ${APMIA_PROCESS_NAME:-bpa-demo}
      APMIA_LOG_LEVEL:                           ${APMIA_LOG_LEVEL:-INFO}
    volumes:
      # Mount read-write so Docker copies /opt/apmia from the image into the
      # named volume on first start (probe .so, BPA .so, pre-configured profile).
      - apmia_data:/opt/apmia
    restart: unless-stopped

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE:      ${MARIADB_DATABASE}
      MARIADB_USER:          ${MARIADB_USER}
      MARIADB_PASSWORD:      ${MARIADB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      # Schema and seed are applied once on first container creation.
      # Delete the named volume (docker compose down -v) to re-initialise.
      - ./helm/php-demo/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./helm/php-demo/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1",
             "-u", "root", "--password=${MARIADB_ROOT_PASSWORD}"]
      interval: 10s
      timeout:  5s
      retries:  6
      start_period: 30s
    restart: unless-stopped

  apachephp:
    image: ${REGISTRY}/${IMAGE_PREFIX}/apache-php:${IMAGE_TAG}
    build:
      context: ./src/apache-php   # app.tar.gz must exist here before building
    pull_policy: never             # use local image only – compose.sh builds it
    ports:
      - "8080:8080"
    environment:
      MARIADB_HOST:     mariadb
      MARIADB_PORT:     "3306"
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER:     ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
      # DX O2 PHP probe → IA collector.  In Compose, reach dxo2 by service name.
      APMIA_PHP_COLLECTOR_HOST: dxo2
      APMIA_PHP_COLLECTOR_PORT: ${APMIA_PHP_COLLECTOR_PORT:-5005}
      # DX O2 BPA plugin → BTL.  In Compose, reach dxo2 by service name.
      APMIA_BTL_HOST: dxo2
      APMIA_BTL_PORT: ${APMIA_BTL_PORT:-8000}
      # Probe/plugin identity in the DX O2 APM metric tree.
      APMIA_APP_NAME:        ${APMIA_APP_NAME:-bpa-demo}
      APMIA_PHP_AGENT_NAME:  ${APMIA_PHP_AGENT_NAME:-bpa-demo-php-probe}
      APMIA_WEB_AGENT_NAME:  ${APMIA_WEB_AGENT_NAME:-bpa-demo-web-plugin}
    volumes:
      # Populated by the dxo2 service on first start (probe .so + .ini + BPA .so).
      - apmia_data:/opt/apmia:ro
    depends_on:
      mariadb:
        condition: service_healthy
      dxo2:
        condition: service_started
    restart: unless-stopped

volumes:
  mariadb_data:
  apmia_data:   # populated from dx-o2-agents image on first start; delete with down -v
