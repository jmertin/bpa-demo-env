---
# BPA-Demo – Docker Compose deployment (no TLS, local images)
# Use scripts/compose.sh – it sources .config, packages the app, and builds
# images locally when they are not already present in the local Docker store.
# The two app services use pull_policy: never so Docker never contacts the
# registry; images must be built locally first (compose.sh handles this).
services:

  mariadb:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD}
      MARIADB_DATABASE:      ${MARIADB_DATABASE}
      MARIADB_USER:          ${MARIADB_USER}
      MARIADB_PASSWORD:      ${MARIADB_PASSWORD}
    volumes:
      - mariadb_data:/var/lib/mysql
      # Schema and seed are applied once on first container creation.
      # Delete the named volume (docker compose down -v) to re-initialise.
      - ./helm/php-demo/sql/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./helm/php-demo/sql/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mariadb-admin", "ping", "-h", "127.0.0.1",
             "-u", "root", "--password=${MARIADB_ROOT_PASSWORD}"]
      interval: 10s
      timeout:  5s
      retries:  6
      start_period: 30s
    restart: unless-stopped

  phpfpm:
    image: ${REGISTRY}/${IMAGE_PREFIX}/php-fpm:${IMAGE_TAG}
    build:
      context: ./docker/php-fpm   # app.tar.gz must exist here before building
    pull_policy: never             # use local image only – compose.sh builds it
    environment:
      MARIADB_HOST:     mariadb
      MARIADB_PORT:     "3306"
      MARIADB_DATABASE: ${MARIADB_DATABASE}
      MARIADB_USER:     ${MARIADB_USER}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD}
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

  nginx:
    image: ${REGISTRY}/${IMAGE_PREFIX}/nginx:${IMAGE_TAG}
    build:
      context: ./docker/nginx
    pull_policy: never             # use local image only – compose.sh builds it
    ports:
      - "8080:8080"
    volumes:
      # Override the default vhost with a Compose-aware config that routes
      # FastCGI to the phpfpm service rather than 127.0.0.1 (pod-local).
      - ./docker/nginx/config/default-compose.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - phpfpm
    restart: on-failure

volumes:
  mariadb_data:
