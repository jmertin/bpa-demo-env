apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "php-demo.configmapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "php-demo.labels" . | nindent 4 }}
data:
  # ── nginx configuration ────────────────────────────────────────────────────
  nginx.conf: |
    # load_module directives must appear at top level before events {}.
    # The BPA entrypoint writes a load_module line here when the DX O2 agent
    # volume is mounted; the directory is empty and the include is a no-op
    # when running without the agent.
    include /etc/nginx/modules-enabled/*.conf;

    worker_processes auto;
    pid /tmp/nginx.pid;
    error_log /proc/self/fd/2 warn;

    events {
        worker_connections 1024;
        multi_accept on;
    }

    http {
        include      /etc/nginx/mime.types;
        default_type application/octet-stream;

        access_log /proc/self/fd/1 combined;

        sendfile    on;
        tcp_nopush  on;
        tcp_nodelay on;
        keepalive_timeout 65;
        server_tokens off;

        client_body_temp_path /tmp/nginx-client;
        proxy_temp_path       /tmp/nginx-proxy;
        fastcgi_temp_path     /tmp/nginx-fastcgi;

        include /etc/nginx/conf.d/*.conf;
    }

  default.conf: |
    server {
        listen 8080;
        server_name _;

        location ~ \.php$ {
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
            include       fastcgi_params;
            fastcgi_connect_timeout 10s;
            fastcgi_send_timeout    60s;
            fastcgi_read_timeout    60s;
        }

        location / {
            fastcgi_pass  127.0.0.1:9000;
            fastcgi_index index.php;
            fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
            fastcgi_param REQUEST_URI     $request_uri;
            include       fastcgi_params;
        }

        location ~ /\. {
            deny all;
        }
    }

  # ── PHP-FPM pool configuration ─────────────────────────────────────────────
  www.conf: |
    [www]
    user  = www-data
    group = www-data
    listen = 0.0.0.0:9000
    pm                   = dynamic
    pm.max_children      = 10
    pm.start_servers     = 2
    pm.min_spare_servers = 1
    pm.max_spare_servers = 4
    pm.max_requests      = 500
    access.log           = /proc/self/fd/2
    catch_workers_output = yes
    decorate_workers_output = no
    env[MARIADB_HOST]     = $MARIADB_HOST
    env[MARIADB_PORT]     = $MARIADB_PORT
    env[MARIADB_DATABASE] = $MARIADB_DATABASE
    env[MARIADB_USER]     = $MARIADB_USER
    env[MARIADB_PASSWORD] = $MARIADB_PASSWORD
