apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "php-demo.configmapName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "php-demo.labels" . | nindent 4 }}
data:
  # ── Apache VirtualHost configuration ──────────────────────────────────────
  # Mounted into the apache-php container at:
  #   /etc/apache2/sites-available/bpa-demo.conf (subPath mount)
  # The sites-enabled/ symlink created by a2ensite in the image follows this
  # ConfigMap-sourced file automatically.
  vhost.conf: |
    <VirtualHost *:8080>
        ServerAdmin webmaster@localhost
        DocumentRoot /var/www/html

        DirectoryIndex index.php index.html

        <Directory /var/www/html>
            Options -Indexes +FollowSymLinks
            AllowOverride All
            Require all granted
        </Directory>

        <Location /setup/>
            Require all denied
        </Location>

        <FilesMatch "^\.">
            Require all denied
        </FilesMatch>

        ErrorLog  /proc/self/fd/2
        CustomLog /proc/self/fd/1 combined
    </VirtualHost>
