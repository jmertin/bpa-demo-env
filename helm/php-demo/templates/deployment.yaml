apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "php-demo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "php-demo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "php-demo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "php-demo.labels" . | nindent 8 }}
      annotations:
        # Force pod recreation when the ConfigMap changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.dxo2.enabled }}
        # Record agent coordinates for observability tooling.
        dxo2.broadcom.com/em-host: {{ .Values.dxo2.emHost | quote }}
        dxo2.broadcom.com/agent-name: {{ .Values.dxo2.agentName | quote }}
        {{- end }}
    spec:
      # Pull credentials are attached to the ServiceAccount; the pod inherits
      # them automatically without listing the secret here.
      serviceAccountName: {{ include "php-demo.fullname" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      # 60 s grace period lets MariaDB flush and close files cleanly
      # before the kubelet escalates to SIGKILL.
      terminationGracePeriodSeconds: 60

      initContainers:

        {{- if .Values.dxo2.enabled }}
        # Populate the shared emptyDir with the pre-installed APMIA agent tree
        # so that the php-fpm and nginx containers can perform opportunistic probe
        # and plugin injection at their own startup without pulling extra images.
        - name: dxo2-init
          image: "{{ .Values.image.dxo2.repository }}:{{ .Values.image.dxo2.tag }}"
          imagePullPolicy: {{ .Values.image.dxo2.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              echo "[dxo2-init] Copying APMIA agent tree to shared volume..."
              cp -a /opt/apmia/. /apmia-share/
              echo "[dxo2-init] Done – $(find /apmia-share -maxdepth 1 | wc -l) entries in /apmia-share"
          volumeMounts:
            - name: apmia-share
              mountPath: /apmia-share
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false   # APMIA installer creates root-owned files; cp requires same owner
        {{- end }}

        # Remove stale Aria lock file left by an unclean shutdown (SIGKILL).
        # fcntl locks are process-bound and released on exit, but on some
        # container runtimes the new container starts before the previous
        # process's OS resources are fully reaped.  Removing aria_log_control
        # is safe here because all schema tables use InnoDB; MariaDB will
        # recreate the file and run Aria crash recovery on first start.
        - name: mariadb-lock-cleanup
          image: "{{ .Values.image.mariadb.repository }}:{{ .Values.image.mariadb.tag }}"
          imagePullPolicy: {{ .Values.image.mariadb.pullPolicy }}
          command:
            - bash
            - -c
            - |
              set -e
              DATA=/var/lib/mysql
              for f in aria_log_control aria_log.00000001 \
                        multi-master.info *.pid; do
                target="${DATA}/${f}"
                # use glob-safe removal
                ls ${target} 2>/dev/null | xargs -r rm -f
              done
              echo "Lock cleanup complete."
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false

      containers:

        # ── dx-o2-agent sidecar ───────────────────────────────────────────────
        # Runs the Broadcom Infrastructure Agent daemon (Java process) and the
        # BTL binary.  Enabled only when dxo2.enabled=true; the php-fpm and
        # nginx containers start without it if this block is absent.
        {{- if .Values.dxo2.enabled }}
        - name: dx-o2-agent
          image: "{{ .Values.image.dxo2.repository }}:{{ .Values.image.dxo2.tag }}"
          imagePullPolicy: {{ .Values.image.dxo2.pullPolicy }}
          env:
            - name: APMIA_HOME
              value: "/opt/apmia"
            - name: APMIA_EM_HOST
              value: {{ .Values.dxo2.emHost | required "dxo2.emHost is required when dxo2.enabled=true" | quote }}
            - name: APMIA_EM_PORT
              value: {{ .Values.dxo2.emPort | quote }}
            - name: APMIA_AGENT_NAME
              value: {{ .Values.dxo2.agentName | quote }}
            - name: APMIA_APP_NAME
              value: {{ .Values.dxo2.appName | quote }}
            - name: APMIA_LOG_LEVEL
              value: {{ .Values.dxo2.logLevel | quote }}
          {{- with .Values.dxo2.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false   # APMIA agent daemon writes to /opt/apmia/logs owned by root
        {{- end }}

        # ── nginx ─────────────────────────────────────────────────────────────
        - name: nginx
          image: "{{ .Values.image.nginx.repository }}:{{ .Values.image.nginx.tag }}"
          imagePullPolicy: {{ .Values.image.nginx.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          {{- if .Values.dxo2.enabled }}
          env:
            - name: APMIA_HOME
              value: "/opt/apmia"
          {{- end }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
            - name: tmp-nginx
              mountPath: /tmp
            {{- if .Values.dxo2.enabled }}
            # Populated by dxo2-init; entrypoint reads BPA module from here.
            - name: apmia-share
              mountPath: /opt/apmia
              readOnly: true
            {{- end }}
          {{- with .Values.resources.nginx }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.nginx.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.nginx.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false   # nginx writes temp files to /tmp
            runAsNonRoot: false             # nginx master needs to bind/manage workers

        # ── php-fpm ───────────────────────────────────────────────────────────
        - name: php-fpm
          image: "{{ .Values.image.phpfpm.repository }}:{{ .Values.image.phpfpm.tag }}"
          imagePullPolicy: {{ .Values.image.phpfpm.pullPolicy }}
          ports:
            - name: fastcgi
              containerPort: 9000
              protocol: TCP
          env:
            # Expose MariaDB connection details to PHP via environment.
            # The application reads these from getenv().
            - name: MARIADB_HOST
              value: "127.0.0.1"
            - name: MARIADB_PORT
              value: "3306"
            - name: MARIADB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "php-demo.secretName" . }}
                  key: MARIADB_DATABASE
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "php-demo.secretName" . }}
                  key: MARIADB_USER
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "php-demo.secretName" . }}
                  key: MARIADB_PASSWORD
            {{- if .Values.dxo2.enabled }}
            - name: APMIA_HOME
              value: "/opt/apmia"
            {{- end }}
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/php-fpm-pool.d/www.conf
              subPath: www.conf
              readOnly: true
            {{- if .Values.dxo2.enabled }}
            # Populated by dxo2-init; entrypoint injects PHP probe from here.
            - name: apmia-share
              mountPath: /opt/apmia
              readOnly: true
            {{- end }}
          {{- with .Values.resources.phpfpm }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.phpfpm.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.phpfpm.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false   # master process needs root; workers drop to www-data

        # ── mariadb ───────────────────────────────────────────────────────────
        - name: mariadb
          image: "{{ .Values.image.mariadb.repository }}:{{ .Values.image.mariadb.tag }}"
          imagePullPolicy: {{ .Values.image.mariadb.pullPolicy }}
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "php-demo.secretName" . }}
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
            - name: db-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          {{- with .Values.resources.mariadb }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.mariadb.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.mariadb.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                # Flush and shut down MariaDB gracefully before SIGTERM arrives.
                # This ensures InnoDB/Aria write the final checkpoint and release
                # all file locks cleanly, preventing stale locks on the next start.
                command:
                  - bash
                  - -c
                  - mariadb-admin -u root -p"${MARIADB_ROOT_PASSWORD}" shutdown 2>/dev/null || true
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false   # official mariadb image initialises as root then drops

      volumes:
        - name: nginx-config
          configMap:
            name: {{ include "php-demo.configmapName" . }}
        - name: tmp-nginx
          emptyDir: {}
        - name: mariadb-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "php-demo.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: db-init
          configMap:
            name: {{ include "php-demo.fullname" . }}-db-init
        {{- if .Values.dxo2.enabled }}
        # Shared agent tree: dxo2-init populates this at pod startup; nginx and
        # php-fpm mount it read-only for opportunistic probe/plugin injection.
        - name: apmia-share
          emptyDir: {}
        {{- end }}
