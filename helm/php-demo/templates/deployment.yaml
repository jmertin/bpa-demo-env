apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "php-demo.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "php-demo.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "php-demo.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "php-demo.labels" . | nindent 8 }}
      annotations:
        # Force pod recreation when the ConfigMap changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.dxo2.enabled }}
        # Record agent coordinates for observability tooling.
        dxo2.broadcom.com/em-host: {{ .Values.dxo2.emHost | quote }}
        dxo2.broadcom.com/agent-name: {{ .Values.dxo2.agentName | quote }}
        {{- end }}
    spec:
      # Pull credentials are attached to the ServiceAccount; the pod inherits
      # them automatically without listing the secret here.
      serviceAccountName: {{ include "php-demo.fullname" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}

      # 60 s grace period lets MariaDB flush and close files cleanly
      # before the kubelet escalates to SIGKILL.
      terminationGracePeriodSeconds: 60

      initContainers:

        {{- if .Values.dxo2.enabled }}
        # Populate the shared emptyDir with the pre-installed APMIA agent tree
        # so that the apache-php container can perform opportunistic probe and
        # BPA plugin injection at startup without pulling extra images.
        - name: dxo2-init
          image: "{{ .Values.image.dxo2.repository }}:{{ .Values.image.dxo2.tag }}"
          imagePullPolicy: {{ .Values.image.dxo2.pullPolicy }}
          command:
            - sh
            - -c
            - |
              set -e
              echo "[dxo2-init] Copying APMIA agent tree to shared volume..."
              cp -a /opt/apmia/. /apmia-share/
              echo "[dxo2-init] Done – $(find /apmia-share -maxdepth 1 | wc -l) entries in /apmia-share"
          volumeMounts:
            - name: apmia-share
              mountPath: /apmia-share
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false   # APMIA installer creates root-owned files; cp requires same owner
        {{- end }}

        # Remove stale Aria lock file left by an unclean shutdown (SIGKILL).
        # fcntl locks are process-bound and released on exit, but on some
        # container runtimes the new container starts before the previous
        # process's OS resources are fully reaped.  Removing aria_log_control
        # is safe here because all schema tables use InnoDB; MariaDB will
        # recreate the file and run Aria crash recovery on first start.
        - name: mariadb-lock-cleanup
          image: "{{ .Values.image.mariadb.repository }}:{{ .Values.image.mariadb.tag }}"
          imagePullPolicy: {{ .Values.image.mariadb.pullPolicy }}
          command:
            - bash
            - -c
            - |
              set -e
              DATA=/var/lib/mysql
              for f in aria_log_control aria_log.00000001 \
                        multi-master.info *.pid; do
                target="${DATA}/${f}"
                # use glob-safe removal
                ls ${target} 2>/dev/null | xargs -r rm -f
              done
              echo "Lock cleanup complete."
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false

      containers:

        # ── dx-o2-agent sidecar ───────────────────────────────────────────────
        # Runs the Broadcom Infrastructure Agent daemon (Java process) and the
        # BTL binary.  Enabled only when dxo2.enabled=true; the php-fpm and
        # nginx containers start without it if this block is absent.
        {{- if .Values.dxo2.enabled }}
        - name: dx-o2-agent
          image: "{{ .Values.image.dxo2.repository }}:{{ .Values.image.dxo2.tag }}"
          imagePullPolicy: {{ .Values.image.dxo2.pullPolicy }}
          env:
            - name: APMIA_HOME
              value: "/opt/apmia"
            # emHost is optional when using the DX O2 installer download – the
            # EM connection is pre-configured in the agent's IntroscopeAgent.profile.
            {{- if .Values.dxo2.emHost }}
            - name: APMIA_EM_HOST
              value: {{ .Values.dxo2.emHost | quote }}
            {{- end }}
            - name: APMIA_EM_PORT
              value: {{ .Values.dxo2.emPort | quote }}
            # Agent identity: override auto-detected container hostname/name so
            # the agent appears with human-readable labels in the APM console.
            - name: APMIA_AGENT_NAME
              value: {{ .Values.dxo2.agentName | quote }}
            - name: APMIA_APP_NAME
              value: {{ .Values.dxo2.appName | quote }}
            - name: APMIA_HOST_NAME
              value: {{ .Values.dxo2.hostName | quote }}
            - name: APMIA_PROCESS_NAME
              value: {{ .Values.dxo2.processName | quote }}
            - name: APMIA_LOG_LEVEL
              value: {{ .Values.dxo2.logLevel | quote }}
            - name: APMIA_PHP_COLLECTOR_HOST
              value: {{ .Values.dxo2.phpCollectorHost | quote }}
            - name: APMIA_PHP_COLLECTOR_PORT
              value: {{ .Values.dxo2.phpCollectorPort | quote }}
            - name: APMIA_BTL_HOST
              value: {{ .Values.dxo2.btlHost | quote }}
            - name: APMIA_BTL_PORT
              value: {{ .Values.dxo2.btlPort | quote }}
          ports:
            # Informational: the IA PHP collector socket and BTL listener ports.
            # Containers in the same pod communicate via 127.0.0.1 – no Service needed.
            - name: php-collector
              containerPort: {{ .Values.dxo2.phpCollectorPort }}
              protocol: TCP
            - name: btl
              containerPort: {{ .Values.dxo2.btlPort }}
              protocol: TCP
          {{- with .Values.dxo2.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false   # APMIA agent daemon writes to /opt/apmia/logs owned by root
        {{- end }}

        # ── apache-php ────────────────────────────────────────────────────────
        # Single container combining Apache 2.4 + mod_php 8.1, replacing the
        # former nginx + php-fpm two-container setup.  Both the PHP probe and
        # the BPA WebServer Plugin (Apache) are injected opportunistically at
        # startup from the apmia-share emptyDir when dxo2 is enabled.
        - name: apache-php
          image: "{{ .Values.image.apachephp.repository }}:{{ .Values.image.apachephp.tag }}"
          imagePullPolicy: {{ .Values.image.apachephp.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            # Expose MariaDB connection details to PHP via environment.
            # mod_php inherits the process environment so getenv() works directly.
            - name: MARIADB_HOST
              value: "127.0.0.1"
            - name: MARIADB_PORT
              value: "3306"
            - name: MARIADB_DATABASE
              valueFrom:
                secretKeyRef:
                  name: {{ include "php-demo.secretName" . }}
                  key: MARIADB_DATABASE
            - name: MARIADB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ include "php-demo.secretName" . }}
                  key: MARIADB_USER
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "php-demo.secretName" . }}
                  key: MARIADB_PASSWORD
            {{- if .Values.dxo2.enabled }}
            - name: APMIA_HOME
              value: "/opt/apmia"
            # Both the IA PHP collector and the BTL are in the dx-o2-agent
            # sidecar container; same pod → always 127.0.0.1.
            - name: APMIA_PHP_COLLECTOR_HOST
              value: {{ .Values.dxo2.phpCollectorHost | quote }}
            - name: APMIA_PHP_COLLECTOR_PORT
              value: {{ .Values.dxo2.phpCollectorPort | quote }}
            - name: APMIA_BTL_HOST
              value: {{ .Values.dxo2.btlHost | quote }}
            - name: APMIA_BTL_PORT
              value: {{ .Values.dxo2.btlPort | quote }}
            # Probe/plugin identity in the DX O2 metric tree.
            - name: APMIA_APP_NAME
              value: {{ .Values.dxo2.appName | quote }}
            - name: APMIA_PHP_AGENT_NAME
              value: {{ .Values.dxo2.phpAgentName | quote }}
            - name: APMIA_WEB_AGENT_NAME
              value: {{ .Values.dxo2.webAgentName | quote }}
            {{- end }}
          volumeMounts:
            # ConfigMap vhost overrides the baked-in sites-available/bpa-demo.conf;
            # the sites-enabled/ symlink from a2ensite follows the mounted file.
            - name: app-config
              mountPath: /etc/apache2/sites-available/bpa-demo.conf
              subPath: vhost.conf
              readOnly: true
            {{- if .Values.dxo2.enabled }}
            # Populated by dxo2-init; entrypoint injects PHP probe and BPA module.
            - name: apmia-share
              mountPath: /opt/apmia
              readOnly: true
            {{- end }}
          {{- with .Values.resources.apachephp }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.apachephp.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.apachephp.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false   # Apache master needs root to bind/manage workers

        # ── mariadb ───────────────────────────────────────────────────────────
        - name: mariadb
          image: "{{ .Values.image.mariadb.repository }}:{{ .Values.image.mariadb.tag }}"
          imagePullPolicy: {{ .Values.image.mariadb.pullPolicy }}
          ports:
            - name: mysql
              containerPort: 3306
              protocol: TCP
          envFrom:
            - secretRef:
                name: {{ include "php-demo.secretName" . }}
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
            - name: db-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          {{- with .Values.resources.mariadb }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.mariadb.livenessProbe }}
          livenessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.probes.mariadb.readinessProbe }}
          readinessProbe:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          lifecycle:
            preStop:
              exec:
                # Flush and shut down MariaDB gracefully before SIGTERM arrives.
                # This ensures InnoDB/Aria write the final checkpoint and release
                # all file locks cleanly, preventing stale locks on the next start.
                command:
                  - bash
                  - -c
                  - mariadb-admin -u root -p"${MARIADB_ROOT_PASSWORD}" shutdown 2>/dev/null || true
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: false   # official mariadb image initialises as root then drops

      volumes:
        - name: app-config
          configMap:
            name: {{ include "php-demo.configmapName" . }}
        - name: mariadb-data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "php-demo.pvcName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: db-init
          configMap:
            name: {{ include "php-demo.fullname" . }}-db-init
        {{- if .Values.dxo2.enabled }}
        # Shared agent tree: dxo2-init populates this at pod startup; apache-php
        # mounts it read-only for opportunistic probe and BPA plugin injection.
        - name: apmia-share
          emptyDir: {}
        {{- end }}
