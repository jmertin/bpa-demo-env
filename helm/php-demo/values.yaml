# Default values for php-demo.
# Sensitive values (passwords, registry credentials) must be supplied via
# values.local.yaml generated by scripts/deploy.sh – never committed to git.

replicaCount: 1

image:
  phpfpm:
    repository: registry.example.com/php-demo/php-fpm
    tag: "1.0.0"
    pullPolicy: Always   # custom image – always pull so retagged builds are picked up
  nginx:
    repository: registry.example.com/php-demo/nginx
    tag: "1.0.0"
    pullPolicy: Always   # custom image – always pull so retagged builds are picked up
  dxo2:
    repository: registry.example.com/php-demo/dx-o2-agents
    tag: "1.0.0"
    pullPolicy: Always   # custom image – always pull so retagged builds are picked up
  mariadb:
    # Pinned upstream tag; IfNotPresent avoids redundant pulls on every restart.
    repository: mariadb
    tag: "11"
    pullPolicy: IfNotPresent

# Registry credentials used to create the image-pull secret that is attached
# to the ServiceAccount.  Supply via values.local.yaml (generated by deploy.sh)
# – never commit real credentials to this file.
imageCredentials:
  registry: ""    # e.g. registry.example.com
  username: ""    # set via values.local.yaml
  password: ""    # set via values.local.yaml

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: ""     # set via .config (INGRESS_CLASS_NAME) → values.local.yaml
  annotations: {}
  hosts:
    - host: php-demo.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: php-demo-tls
      hosts:
        - php-demo.example.com

# MariaDB configuration.  Credentials are injected via the generated secret.
mariadb:
  auth:
    rootPassword: ""    # set via values.local.yaml
    database: phpapp
    username: phpuser
    password: ""        # set via values.local.yaml

persistence:
  enabled: true
  storageClass: ""      # use cluster default
  accessMode: ReadWriteOnce
  size: 1Gi

# Per-container resource budgets (minimal for a demo workload).
resources:
  nginx:
    requests:
      memory: "32Mi"
      cpu: "25m"
    limits:
      memory: "128Mi"
      cpu: "250m"
  phpfpm:
    requests:
      memory: "64Mi"
      cpu: "50m"
    limits:
      memory: "256Mi"
      cpu: "500m"
  mariadb:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "1000m"

podSecurityContext:
  fsGroup: 33          # www-data GID

# Liveness / readiness probes
probes:
  nginx:
    livenessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 15
      periodSeconds: 20
    readinessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
  phpfpm:
    livenessProbe:
      tcpSocket:
        port: 9000
      initialDelaySeconds: 15
      periodSeconds: 20
    readinessProbe:
      tcpSocket:
        port: 9000
      initialDelaySeconds: 5
      periodSeconds: 10
  mariadb:
    livenessProbe:
      exec:
        command:
          - bash
          - -c
          - "mariadb-admin ping -h 127.0.0.1 -u root -p${MARIADB_ROOT_PASSWORD}"
      initialDelaySeconds: 30
      periodSeconds: 20
    readinessProbe:
      exec:
        command:
          - bash
          - -c
          - "mariadb -h 127.0.0.1 -u ${MARIADB_USER} -p${MARIADB_PASSWORD} -e 'SELECT 1'"
      initialDelaySeconds: 10
      periodSeconds: 10

# ── Broadcom DX O2 Agent (APMIA) ─────────────────────────────────────────────
# When enabled, an initContainer (dxo2-init) copies the pre-installed APMIA
# agent tree from the dx-o2-agents image to a shared emptyDir volume.  The
# php-fpm and nginx containers mount this volume at /opt/apmia so their
# entrypoints can inject the PHP probe and BPA WebServer Plugin at runtime
# without baking agent binaries into the application images.
#
# The dx-o2-agent sidecar container then runs the Infrastructure Agent daemon
# (Java process) and the BTL binary for the duration of the pod's lifetime.
#
# Set enabled: false (the default) to run without any DX O2 instrumentation.
# All application containers start cleanly in that mode.
dxo2:
  enabled: false
  emHost: ""              # Enterprise Manager hostname or IP (required when enabled)
  emPort: "8443"          # EM collector port (8443=WSS default, 5443=SSL/TCP, 5001=plain-TCP)
  agentName: "bpa-demo-agent"
  appName: "BPA-Demo"
  logLevel: "INFO"        # DEBUG | INFO | WARN | ERROR

  # Same-pod IPC endpoints.  All containers in the pod share 127.0.0.1 (Kubernetes
  # network namespace).  Override only when running the agent in a separate pod/service.
  phpCollectorHost: "127.0.0.1"  # IA PHP collector: php-fpm probe → dx-o2-agent
  phpCollectorPort: "55512"      # Default IA PHP collector port
  btlHost: "127.0.0.1"          # BTL: nginx BPA plugin → dx-o2-agent
  btlPort: "9001"                # Default BTL listener port

  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"
