# Default values for php-demo.
# Sensitive values (passwords, registry credentials) must be supplied via
# values.local.yaml generated by scripts/deploy.sh – never committed to git.

replicaCount: 1

image:
  apachephp:
    repository: registry.example.com/php-demo/apache-php
    tag: "1.0.0"
    pullPolicy: Always   # custom image – always pull so retagged builds are picked up
  dxo2:
    repository: registry.example.com/php-demo/dx-o2-agents
    tag: "1.0.0"
    pullPolicy: Always   # custom image – always pull so retagged builds are picked up
  mariadb:
    # Pinned upstream tag; IfNotPresent avoids redundant pulls on every restart.
    repository: mariadb
    tag: "11"
    pullPolicy: IfNotPresent

# Registry credentials used to create the image-pull secret that is attached
# to the ServiceAccount.  Supply via values.local.yaml (generated by deploy.sh)
# – never commit real credentials to this file.
imageCredentials:
  registry: ""    # e.g. registry.example.com
  username: ""    # set via values.local.yaml
  password: ""    # set via values.local.yaml

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: ""     # set via .config (INGRESS_CLASS_NAME) → values.local.yaml
  annotations: {}
  hosts:
    - host: php-demo.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: php-demo-tls
      hosts:
        - php-demo.example.com

# MariaDB configuration.  Credentials are injected via the generated secret.
mariadb:
  auth:
    rootPassword: ""    # set via values.local.yaml
    database: phpapp
    username: phpuser
    password: ""        # set via values.local.yaml

persistence:
  enabled: true
  storageClass: ""      # use cluster default
  accessMode: ReadWriteOnce
  size: 1Gi

# Per-container resource budgets (minimal for a demo workload).
resources:
  apachephp:
    # Combined budget for the former nginx + php-fpm two-container split.
    requests:
      memory: "128Mi"
      cpu: "50m"
    limits:
      memory: "384Mi"
      cpu: "500m"
  mariadb:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "1000m"

podSecurityContext:
  fsGroup: 33          # www-data GID

# Liveness / readiness probes
probes:
  apachephp:
    livenessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 15
      periodSeconds: 20
    readinessProbe:
      httpGet:
        path: /
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 10
  mariadb:
    livenessProbe:
      exec:
        command:
          - bash
          - -c
          - "mariadb-admin ping -h 127.0.0.1 -u root -p${MARIADB_ROOT_PASSWORD}"
      initialDelaySeconds: 30
      periodSeconds: 20
    readinessProbe:
      exec:
        command:
          - bash
          - -c
          - "mariadb -h 127.0.0.1 -u ${MARIADB_USER} -p${MARIADB_PASSWORD} -e 'SELECT 1'"
      initialDelaySeconds: 10
      periodSeconds: 10

# ── Broadcom DX O2 Agent (APMIA) ─────────────────────────────────────────────
# When enabled, an initContainer (dxo2-init) copies the pre-installed APMIA
# agent tree from the dx-o2-agents image to a shared emptyDir volume.  The
# php-fpm and nginx containers mount this volume at /opt/apmia so their
# entrypoints can inject the PHP probe and BPA WebServer Plugin at runtime
# without baking agent binaries into the application images.
#
# The dx-o2-agent sidecar container then runs the Infrastructure Agent daemon
# (Java process) and the BTL binary for the duration of the pod's lifetime.
#
# Set enabled: false (the default) to run without any DX O2 instrumentation.
# All application containers start cleanly in that mode.
dxo2:
  enabled: false
  # APMIA_DEPLOY=false → passive volume (agent tree seeded, IA not started).
  # Set to "true" (default) to run the Infrastructure Agent from this container.
  deploy: "true"
  # emHost and emPort are NOT required when using the DX O2 installer download.
  # The PHP_apmia*.tar from the DX O2 interface includes a pre-configured
  # IntroscopeAgent.profile with the EM URL (WSS) and JWT credential baked in.
  # Set emHost only if you need to override the pre-configured EM URL.
  emHost: ""
  emPort: "8443"          # Informational only when using pre-configured profile

  # ── Agent identity ──────────────────────────────────────────────────────────
  # These values override the auto-detected Docker/Kubernetes hostname and name
  # so the agent appears with human-readable labels in the DX O2 APM console.
  # They are exposed to the dx-o2-agent container as APMENV_* environment variables
  # – the native APMIA Docker mechanism.  The agent startup script reads them and
  # overrides the corresponding introscope.* profile properties automatically:
  #   APMENV_INTROSCOPE_AGENT_AGENTNAME         → introscope.agent.agentName
  #   APMENV_INTROSCOPE_AGENT_APPLICATION_NAME  → introscope.agent.application.name
  #   APMENV_INTROSCOPE_AGENT_HOSTNAME          → introscope.agent.hostName
  #   APMENV_INTROSCOPE_AGENT_CUSTOMPROCESSNAME → introscope.agent.customProcessName
  agentName:   "bpa-demo-agent"   # IA leaf name in the metric tree
  appName:     "bpa-demo"         # application grouping in DX O2
  hostName:    "bpa-demo-host"    # overrides container hostname / pod IP
  processName: "bpa-demo"         # custom process name (introscope.agent.customProcessName)
  # logLevel maps to APMENV_LOG4J_LOGGER_INTROSCOPEAGENT="<level>, logfile".
  logLevel: "INFO"                # DEBUG | INFO | WARN | ERROR

  # ── MariaDB/MySQL monitoring (APMIA DB Monitor extension) ──────────────────
  # Credentials are NOT stored here – they come from the mariadb Secret
  # (generated by deploy.sh from .config) and are injected via secretKeyRef.
  dbMonitor:
    enabled: true
    profileName: "bpadb"          # profile label (uppercased in APMENV_* key)
    instanceName: "bpadb"         # display name in the DX O2 console
    hostname: "127.0.0.1"         # same-pod; all containers share 127.0.0.1
    port: "3306"
    querySnapshots: "false"
    queryInterval: "15"
    traceInterval: "30"

  # ── Probe / plugin identity ─────────────────────────────────────────────────
  # phpAgentName: agent name patched into wily_php_agent.agentName (PHP probe).
  # webAgentName: identity exposed to the BPA Apache module via APMIA_WEB_AGENT_NAME.
  phpAgentName: "bpa-demo-php-probe"
  webAgentName: "bpa-demo-web-plugin"
  # Browser agent snippet from the DX O2 tenant (Experience View → Browser Agent).
  # When non-empty the PHP probe injects this into every HTML response.
  # Supply via values.local.yaml (generated by deploy.sh from .config) – the
  # snippet is tenant-specific and must not be committed to this file.
  browserSnippet: ""

  # ── Same-pod IPC endpoints ──────────────────────────────────────────────────
  # All containers in the pod share 127.0.0.1 (Kubernetes network namespace).
  # Override only when running the agent in a separate pod/service.
  # Ports match the DX O2 installer defaults: IA PHP collector 5005, BTL 8000.
  phpCollectorHost: "127.0.0.1"  # IA PHP collector: apache-php probe → dx-o2-agent
  phpCollectorPort: "5005"       # Default IA PHP collector port (wily_php_agent.ini)
  btlHost: "127.0.0.1"          # BTL: apache-php BPA plugin → dx-o2-agent
  btlPort: "8000"                # Default BTL listener port (BTL application.properties)

  resources:
    requests:
      memory: "256Mi"
      cpu: "50m"
    limits:
      memory: "512Mi"
      cpu: "500m"
