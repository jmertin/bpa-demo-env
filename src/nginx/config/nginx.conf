# ── Dynamic module loading ────────────────────────────────────────────────────
# load_module directives must appear at the top level, before events {}.
# The BPA WebServer Plugin entrypoint writes to modules-enabled/bpa.conf;
# when the agent volume is absent the directory is empty and this is a no-op.
include /etc/nginx/modules-enabled/*.conf;

worker_processes auto;

# PID file in /tmp so no root privilege is required at runtime.
pid /tmp/nginx.pid;

error_log /proc/self/fd/2 warn;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /proc/self/fd/1 combined;

    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Write temp files to /tmp so the worker (www-data) can always write them.
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path       /tmp/nginx-proxy;
    fastcgi_temp_path     /tmp/nginx-fastcgi;

    # Do not expose the nginx version in Server headers or error pages.
    server_tokens off;

    include /etc/nginx/conf.d/*.conf;
}
