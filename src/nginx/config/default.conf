server {
    listen 8080;
    server_name _;

    # PHP-FPM runs in the same pod network namespace, reachable via loopback.
    # SCRIPT_FILENAME is set to the php-fpm container's document root because
    # nginx does not have its own copy of the application files.

    location ~ \.php$ {
        fastcgi_pass  127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        include       fastcgi_params;

        fastcgi_connect_timeout 10s;
        fastcgi_send_timeout    60s;
        fastcgi_read_timeout    60s;
    }

    # Route all other requests through the front-controller (index.php).
    location / {
        fastcgi_pass  127.0.0.1:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/index.php;
        fastcgi_param REQUEST_URI     $request_uri;
        include       fastcgi_params;
    }

    # Block web access to setup scripts (CLI-only tools).
    location ^~ /setup/ {
        deny all;
        return 403;
    }

    # Deny access to hidden files.
    location ~ /\. {
        deny all;
    }
}
